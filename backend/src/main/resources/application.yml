server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: bookstore-api
  datasource:
    url: jdbc:h2:file:./data/bookstore;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Override with JWT_SECRET in every non-local environment (min 32 chars).
    secret: ${JWT_SECRET:dev-only-bookstore-jwt-secret-change-me-0123456789abcdef}
    issuer: bookstore-api
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
  security:
    cookie-secure: ${COOKIE_SECURE:false}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    auth-rate-limit-per-minute: 10
  cache:
    books-ttl-seconds: 60

logging:
  level:
    root: INFO
    com.bookstore: INFO
